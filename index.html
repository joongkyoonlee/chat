<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울특별시교육청 계약업무 지침 · Gemini 근거형 챗봇</title>
<style>
html,body{height:100%;margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#172033}.wrap{height:100%;display:grid;place-items:center}.box{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:24px 28px;box-shadow:0 12px 36px rgba(28,45,75,.11);max-width:520px}h1{font-size:18px;margin:0 0 10px}p{margin:0;line-height:1.7;color:#687386}.err{color:#b42318;white-space:pre-wrap;margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="box"><h1>계약업무 챗봇을 불러오는 중입니다.</h1><p>내장 문서와 Gemini RAG 화면을 준비하고 있습니다.</p><div id="err" class="err"></div></div></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:7},(_,i)=>`payload/part${i+1}.txt`);
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(`${f} 불러오기 실패 (${r.status})`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('이 브라우저는 gzip 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge에서 열어 주세요.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('err').textContent='불러오기 오류: '+e.message;
  }
})();
</script>
</body>
</html>
